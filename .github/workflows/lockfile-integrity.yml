name: Lockfile Integrity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frozen-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate lockfile integrity
        run: pnpm install --frozen-lockfile
